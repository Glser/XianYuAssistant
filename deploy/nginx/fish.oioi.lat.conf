# ============================================================
# XianYuAssistant - Nginx 配置（Docker 部署，方案 A：静态分离 + API 反代）
# 域名：fish.oioi.lat
# 后端：Docker 容器 xianyu-assistant:12400（与 nginx 同在 app-network）
# 前端：/usr/share/nginx/html（宿主机 /app/nginx/html 挂载）
# ============================================================

server {
    listen 80;
    server_name fish.oioi.lat;

    # ---------- 基础设置 ----------
    # 容器内路径，对应宿主机 /app/nginx/html/fish.oioi.lat
    root /usr/share/nginx/html/fish.oioi.lat;
    index index.html;

    # 上传文件大小限制（图片上传 / 备份导入需要）
    client_max_body_size 50m;

    # gzip 压缩静态资源
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1k;

    # ---------- SPA 路由（History 模式）----------
    # 静态文件不存在时回退到 index.html，否则刷新子路由会 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 业务 API 反代 ----------
    # 用容器名访问，需确保后端容器与 nginx 在同一个 docker network（app-network）
    location /api/ {
        proxy_pass http://xianyu-assistant:12400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 接口超时（前端 axios 默认 30s，留余量）
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # ---------- AI 接口反代 ----------
    # 注意：AI 控制器是 @RequestMapping("/ai")，不在 /api 下
    location /ai/ {
        proxy_pass http://xianyu-assistant:12400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 对话可能较慢，给足超时
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ---------- 静态资源缓存 ----------
    # Vite 构建的带 hash 资源可以长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

