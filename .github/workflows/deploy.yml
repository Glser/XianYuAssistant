name: 自动部署到 fish.oioi.lat

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只跑一个部署，避免并发冲突
concurrency:
  group: deploy-fish-oioi-lat
  cancel-in-progress: false

# GITHUB_TOKEN 需要写 packages 权限才能推送到 GHCR
permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 提取版本号
        id: version
        run: |
          VERSION=$(grep -A1 '<artifactId>XianYuAssistant</artifactId>' pom.xml | grep '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "镜像版本: $VERSION"

      # ========== 前端构建 ==========
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vue-code/package-lock.json

      - name: 构建前端
        working-directory: vue-code
        run: |
          npm ci
          npm run build

      # ========== 上传前端到服务器 ==========
      - name: 上传前端产物到服务器
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "vue-code/dist"
          target: "/app/nginx/html/fish.oioi.lat"
          strip_components: 2
          overwrite: true

      # ========== 上传 Nginx 配置 ==========
      - name: 上传 Nginx 配置
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "deploy/nginx/fish.oioi.lat.conf"
          target: "/app/nginx/conf.d"
          strip_components: 2
          overwrite: true

      # ========== 构建并推送后端镜像到 GHCR ==========
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/glser/xianyu-assistant:${{ steps.version.outputs.version }}

      # ========== SSH 到服务器：拉取镜像并重启 ==========
      - name: SSH 部署后端并重载 Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            set -e
            mkdir -p /app/fish/db /app/fish/logs /app/nginx/html/fish.oioi.lat
            docker network inspect app-network >/dev/null 2>&1 || docker network create app-network
            IMAGE="ghcr.io/glser/xianyu-assistant:${{ steps.version.outputs.version }}"
            echo "=== 拉取镜像: ${IMAGE} ==="
            docker pull "$IMAGE"
            docker rm -f xianyu-assistant || true
            docker run -d \
              --name xianyu-assistant \
              --restart unless-stopped \
              --network app-network \
              -p 127.0.0.1:12400:12400 \
              -v /app/fish/db:/app/dbdata \
              -v /app/fish/logs:/app/logs \
              "$IMAGE"
            docker exec nginx nginx -t
            docker exec nginx nginx -s reload
            docker image prune -f
            echo "=== 部署完成: ${IMAGE} ==="
            docker ps --filter name=xianyu-assistant --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
